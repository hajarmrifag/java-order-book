<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-labelledby="title">
<title id="title">FIFO matching example from Demo.java</title>
<rect width="720" height="446" rx="8" fill="#F4F1E9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182B2B}.mono{font-family:monospace;letter-spacing:1.5px}.muted{fill:#526460}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<text x="30" y="43" font-size="16" class="mono muted" >PRICE-TIME MATCHING</text><text x="30" y="87" font-size="30" class="serif" >Same price. Earlier order fills first.</text><rect x="30" y="114" width="660" height="90" rx="8" fill="#FFFFFF" stroke="#CCD3CA"/><text x="50" y="147" font-size="15" class="mono muted" >RESTING SELLS AT 100</text><text x="50" y="182" font-size="25" class="" >#1  quantity 5</text><text x="330" y="182" font-size="25" class="" >#2  quantity 4</text><text x="273" y="181" font-size="25" class="" >→</text><rect x="30" y="224" width="660" height="64" rx="8" fill="#DFEAE3" stroke="none"/><text x="50" y="265" font-size="25" class="" >BUY #3 · limit 101 · quantity 7</text><text x="30" y="328" font-size="16" class="mono muted" >FILLS AT MAKER PRICE 100</text><text x="30" y="367" font-size="29" class="" >5 from #1  +  2 from #2</text><text x="30" y="411" font-size="22" class="muted" >#2 keeps its place with quantity 2 remaining.</text>
</svg>
